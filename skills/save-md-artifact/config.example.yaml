# save-md-artifact 用户级配置示例
#
# 复制本文件到对应位置使用：
#   用户级（全局默认）：~/.claude/skills/save-md-artifact/config.yaml
#   项目级（覆盖用户级）：<project_root>/.claude/save-md-artifact.yaml
#
# 优先级：项目级 > 用户级 > skill 内置默认
# 任何字段都可以省略，省略的字段用下一级兜底

# 相对项目根的输出目录
output_dir: ai-docs

# 子目录（可选）；支持多级如 "2026/Q3"，但禁止 .. 和绝对路径
subdir: ""

# slug 最大字符数；超长截断
slug_max_length: 200

# slug 为空 / 全是特殊字符时的兜底名
slug_fallback: untitled